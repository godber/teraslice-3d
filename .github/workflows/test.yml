name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: |
        # The frontend build is required for the backend tests
        # as it serves static assets used in the tests
        cd frontend && pnpm install --frozen-lockfile && pnpm run build && cd -
        cd backend && uv sync --group test && cd -

    - name: Run tests
      run: cd backend && uv run pytest tests/unit/ -v

    - name: Verify Docker Build
      run: |
        docker build -t teraslice-3d:latest .
